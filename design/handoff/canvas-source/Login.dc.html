<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Log in</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Plus+Jakarta+Sans:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 100%; min-height: 100vh; background: #F7F7F8; font-family: Inter, system-ui, sans-serif; color: #0F1115">
  <dc-import name="Signup" mode="Log in" demo="{{demo}}" hint-size="100%,900px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"demo":{"editor":"enum","options":["Default","Errors"],"default":"Errors","section":"Screen"},"$preview":{"width":1280,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return { demo: this.props.demo ?? 'Errors' };
  }
}
</script>
</body>
</html>
