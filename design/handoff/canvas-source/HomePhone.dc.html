<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Marketing homepage — phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Plus+Jakarta+Sans:wght@600;700;800&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; overflow-y: auto; overflow-x: hidden; background: #FFFFFF; font-family: Inter, system-ui, sans-serif; color: #0F1115; position: relative">
  <dc-import name="Home" phone="{{ true }}" minh="844px" accent="{{accent}}" hint-size="390px,844px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","options":["#5B4BDB","#0F766E","#1D4ED8","#B4235A"],"default":"#5B4BDB","section":"Brand"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#5B4BDB' };
  }
}
</script>
</body>
</html>
