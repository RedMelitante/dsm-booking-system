<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Log in — phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Plus+Jakarta+Sans:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; overflow-y: auto; overflow-x: hidden; background: #F7F7F8; font-family: Inter, system-ui, sans-serif; color: #0F1115; position: relative">
  <dc-import name="Signup" mode="Log in" demo="{{demo}}" phone="{{ true }}" minh="844px" hint-size="390px,844px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"demo":{"editor":"enum","options":["Default","Errors"],"default":"Default","section":"Screen"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { demo: this.props.demo ?? 'Default' };
  }
}
</script>
</body>
</html>
